{% extends "public.html" %}{% block title %}{{ t('portal.title', lang) }}{% endblock %}{% block content %}
<div class="card" style="max-width:480px">
  <h1>{{ t('portal.title', lang) }}</h1>
  <p class="muted">{{ t('portal.login.intro', lang) }}</p>
  <form method="post">{{ csrf() }}
    <label>{{ t('portal.login.email', lang) }}</label><input type="email" name="email" required autofocus>
    <div class="actions"><button class="btn">{{ t('portal.login.button', lang) }}</button></div>
  </form>
</div>
{% endblock %}
