services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.http.routers.coil.rule=Host(`practice.iandolan.com`)
      - traefik.http.routers.coil.entrypoints=https
      - traefik.http.routers.coil.tls.certresolver=letsencrypt
      - traefik.http.services.coil.loadbalancer.server.port=8000
      - traefik.http.routers.coil-http.rule=Host(`practice.iandolan.com`)
      - traefik.http.routers.coil-http.entrypoints=http
      - traefik.http.routers.coil-http.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
networks:
  coolify:
    external: true
